# Bitcoin Core configuration — MAINNET
#
# The real network. Blocks mined against this config are worth real money, and
# mistakes here are not recoverable, so the settings below are deliberately
# conservative and each one is explained.
#
# Written out and used by `btc-miner`, or directly: ./scripts/node.sh start mainnet

# Enable the JSON-RPC server so the pool can fetch templates and submit blocks.
server=1

# --- Pruning: ON, 5 GiB of recent blocks ---------------------------------
#
# A pruning node deletes block files once it no longer needs them, keeping only
# a recent window. That is exactly what a mining node wants: templates are built
# from the UTXO set and the tip, and history is never read.
#
# Never point a pruning node at a full archive of the chain, kept elsewhere
# with -blocksdir: it would delete the archive's old block files as it goes.
# scripts/node.sh refuses that combination.
#
# NOTE: this is one-way. Returning to an unpruned node means re-downloading the
# entire chain. 5000 MiB is far more than mining needs and leaves ample room for
# any realistic reorg.
prune=5000

# UTXO cache size in MiB. A synced node needs very little — this size only
# matters during initial sync or a reindex, where a large cache avoids
# enormous numbers of small disk writes. Override it on the command line for
# those (`-dbcache=8000`) rather than carrying the cost permanently.
dbcache=1024

[main]
# JSON-RPC endpoint. 8332 is Bitcoin Core's mainnet default.
rpcport=8332

# ZeroMQ new-block notification. A different port from the regtest config so
# both can run at once without a clash.
zmqpubhashblock=tcp://127.0.0.1:28334
